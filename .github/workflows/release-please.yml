name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip_release: ${{ steps.check.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          skip_release=false

          if [[ "$HEAD_COMMIT_MESSAGE" == *"release-please--branches--main"* ]]; then
            version="$(jq -r '."."' .release-please-manifest.json)"

            if gh release view "v${version}" >/dev/null 2>&1; then
              skip_release=true
            fi
          fi

          echo "skip_release=${skip_release}" >> "$GITHUB_OUTPUT"

  release-please:
    needs: release-preflight
    if: ${{ needs.release-preflight.outputs.skip_release != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs:
      - release-preflight
      - release-please
    if: ${{ needs.release-preflight.outputs.skip_release != 'true' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.15.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
