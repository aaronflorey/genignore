[package]
name = "genignore-cli"
version = "2.0.0"
edition.workspace = true
description = "genignore command-line binary"
license.workspace = true

[[bin]]
name = "genignore"
path = "src/main.rs"

[dependencies]
genignore-core = { path = "../genignore-core" }
genignore-detection = { path = "../genignore-detection" }
serde = "1"
serde_json = "1"
usage-lib = "6"

[target."cfg(unix)".dependencies]
libc = "0.2"
