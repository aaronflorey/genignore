[package]
name = "genignore-core"
version = "0.1.0"
edition.workspace = true
description = "Embedded template catalogs, managed .gitignore blocks, and command services for genignore"
license.workspace = true
build = "build.rs"

[dependencies]
genignore-detection = { path = "../genignore-detection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
serde_json = "1"
