name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test --workspace` includes the embedded catalog and rule-catalog
      # checks, so CI fails if the embedded github-gitignore snapshot or
      # rules.json asset is missing, empty, or invalid.
      - name: Test
        run: cargo test --workspace

  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release -p genignore-cli

      - name: Package and smoke test artifact
        shell: bash
        run: |
          set -euo pipefail

          smoke_dir=$(mktemp -d)
          mkdir -p "$smoke_dir/pkg"
          cp target/release/genignore README.md "$smoke_dir/pkg/"
          tar -czf "$smoke_dir/genignore_0.0.0_linux_amd64.tar.gz" -C "$smoke_dir/pkg" .
          tar -xzf "$smoke_dir/genignore_0.0.0_linux_amd64.tar.gz" -C "$smoke_dir"

          test -x "$smoke_dir/genignore"
          test -f "$smoke_dir/README.md"

          "$smoke_dir/genignore" list >"$smoke_dir/list.txt"
          "$smoke_dir/genignore" help >"$smoke_dir/help.txt"

          test -s "$smoke_dir/list.txt"
          test -s "$smoke_dir/help.txt"
